plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.baseload.energyanalytics'
    compileSdk 36

    defaultConfig {
        applicationId 'ai.baseload.energyanalytics'
        minSdk 24
        targetSdk 36
        // CI passes a number that only ever grows
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName(System.getenv('VERSION_NAME') ?: '1.0.0')
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'missing.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.play:review:2.0.2'
    // review pulls very old AndroidX that Play flags as outdated; pin current releases (same fix as Megawatt Mogul)
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.core:core:1.13.1'
}

// newer AndroidX brings kotlin-stdlib 1.8 which already holds the old jdk7/jdk8 split jars -> duplicate classes
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
