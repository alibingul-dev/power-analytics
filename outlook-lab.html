<!doctype html>
<html lang="en" data-noi18n>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Price Outlook Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;
 --bg:#0E1520;--card:#16202E;--surface-2:#1D2A3B;--line:#26364B;--fg:#E6EDF5;--muted:#8A9BB0;--accent:#FBBF24;--navy:#38BDF8;--good:#34D399;--bad:#F43F5E;--band:rgba(56,189,248,.14);--input:#1D2A3B;
 --font:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;--display:Archivo,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:clip}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;padding:24px clamp(16px,3vw,48px) 60px;-webkit-font-smoothing:antialiased}
h1{font-family:var(--display);font-size:28px;margin:0;font-weight:800;letter-spacing:-.02em}
h2{font-family:var(--display);font-size:15px;margin:0 0 10px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin:0 0 16px}
.sub{color:var(--muted);font-size:14px;max-width:90ch}
.wrap{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px}
@media (max-width:980px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.rail{display:flex;flex-direction:column;gap:16px}
.row{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;margin-bottom:8px}
.row label{font-size:13.5px;color:var(--fg)}
.row small{display:block;color:var(--muted);font-size:11.5px}
.row label[data-tip]{position:relative;cursor:help;text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.row label[data-tip]:hover::after,.row label[data-tip]:focus::after{content:attr(data-tip);position:absolute;left:0;top:100%;margin-top:6px;z-index:50;width:min(280px,80vw);padding:8px 10px;background:var(--surface-2);border:1px solid var(--navy);border-radius:6px;color:var(--fg);font-size:12.5px;line-height:1.4;white-space:normal;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.45)}
input[type=number],select{width:100%;font:500 14px var(--mono);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--fg)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.adv{margin:4px 0 12px;border-top:1px solid var(--line);padding-top:8px}
.adv summary{cursor:pointer;font-size:13px;color:var(--muted);margin-bottom:8px}
.adv[open] summary{color:var(--fg)}
button{font:600 13px var(--font);padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer}
button.primary{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font:500 22px/1.1 var(--mono);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:16px}
canvas{max-width:100%}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button[aria-selected=true]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--surface-2);color:var(--fg);font-weight:600;text-align:right;padding:8px 10px;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:6px 10px;border-top:1px solid var(--line);text-align:right;font-family:var(--mono)}
td.why{font-family:var(--font);text-align:left;white-space:normal;min-width:280px;max-width:520px;font-size:12.5px;line-height:1.4;color:var(--fg)}td.why a{color:var(--navy)}
td.w{font-weight:500;background:var(--band)}
tr.year td{font-weight:500}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.pill.calm{background:rgba(52,211,153,.15);color:var(--good)}.pill.stormy{background:rgba(244,63,94,.15);color:var(--bad)}
.nhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.nhead h2{margin:0}.nhead select{width:auto}
.news.off{display:none}
.news{display:flex;flex-direction:column;gap:6px;font-size:13px}
.news .nrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.news label{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:center}
.news .m{display:flex;align-items:center;gap:3px;font-family:var(--mono);color:var(--muted);font-size:12px}
.news .m input{width:52px;padding:3px 4px;font-size:12px}
.news .m em{font-style:normal;margin-right:4px}
.diff{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
.disc{font-size:12px;color:var(--muted);margin:18px 0 0;max-width:120ch}
.lang{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>
<div class="top">
  <div><h1>Price Outlook Lab</h1><div class="sub" id="subtitle"></div></div>
  <div class="lang"><button id="langTR" aria-pressed="true">TR</button><button id="langEN">EN</button></div>
</div>
<div class="wrap">
 <aside class="rail">
  <div class="panel">
   <h2 data-i="inputs">Girdiler</h2>
   <div class="row"><label data-i="asof">Çalıştırma tarihi <small>model verisinin kesim ayı</small></label><select id="asof"></select></div>
   <div class="row"><label data-i="tariff">BOTAŞ santral gaz tarifesi <small>TL/1000 Sm³</small></label><input type="number" id="tariff" step="100"></div>
   <div class="row"><label data-i="fx0">Kur bugün <small>USD/TRY</small></label><input type="number" id="fx0" step="0.1"></div>
   <div class="row"><label data-i="fx1">Kur Ara-26 <small>USD/TRY</small></label><input type="number" id="fx1" step="0.1"></div>
   <div class="row"><label data-i="fx2">Kur Eyl-27 <small>USD/TRY</small></label><input type="number" id="fx2" step="0.1"></div>
   <div class="row"><label data-i="fxg">Sonrası aylık kur artışı <small>%/ay</small></label><input type="number" id="fxg" step="0.1"></div>
   <div class="row"><label data-i="hyd">Hidroloji senaryosu <small>Mar–Haz k çarpanı</small></label><select id="hyd"><option value="0.85" data-i="wet">Sulu (−%15)</option><option value="1" selected data-i="normal">Normal</option><option value="1.15" data-i="dry">Kurak (+%15)</option></select></div>
   <details class="adv"><summary data-i="adv">Gelişmiş ayarlar</summary>
   <div class="row"><label data-i="kLR">k uzun dönem (PTF/G) <small>2017'den beri medyan</small></label><input type="number" id="kLR" step="0.01"></div>
   <div class="row"><label data-i="rk">k geri dönüş hızı <small>aylık, 0–1</small></label><input type="number" id="rk" step="0.01" min="0.5" max="0.99"></div>
   <div class="row"><label data-i="rg">G geri dönüş hızı <small>aylık, 0–1</small></label><input type="number" id="rg" step="0.01" min="0.5" max="0.99"></div>
   <div class="row"><label data-i="w">Persistence w <small>son fiyatın ağırlığı</small></label><input type="number" id="w" step="0.05" min="0" max="1"></div>
   <div class="row"><label data-i="cap">Tavana yapışma oranı <small>aylık ort. / tavan</small></label><input type="number" id="cap" step="0.01" min="0.5" max="1"></div>
   </details>
   <div class="btns"><button class="primary" id="run" data-i="run">Hesapla</button><button id="reset" data-i="reset">Varsayılanlara dön</button></div>
     </div>
  <div class="panel"><div class="nhead"><h2 data-i="newsH">Haber katmanı</h2><select id="newsOn" aria-label="News layer"><option value="0" data-i="off">Kapalı</option><option value="1" data-i="on">Açık</option></select></div><div class="note" data-i="newsNote" style="margin:0 0 8px"></div><div class="note" id="newsState" style="margin:0 0 8px;color:var(--fg)"></div><div class="news" id="newsList"></div></div>
 </aside>
 <main style="min-width:0">
  <div class="kpis">
   <div class="kpi"><div class="l" data-i="k1">Gelecek ay beklenen</div><div class="v" id="k1v"></div><div class="d" id="k1d"></div></div>
   <div class="kpi"><div class="l" data-i="k2">12 ay ortalaması</div><div class="v" id="k2v"></div><div class="d" id="k2d"></div></div>
   <div class="kpi"><div class="l" data-i="k3">Cal-27 beklenen</div><div class="v" id="k3v"></div><div class="d" id="k3d"></div></div>
   <div class="kpi"><div class="l" data-i="k4">Rejim bugün</div><div class="v" id="k4v"></div><div class="d" id="k4d"></div></div>
  </div>
  <div class="chartbox"><div class="note" id="chartread" style="margin:0 0 8px;color:var(--fg)"></div><canvas id="chart" height="150"></canvas><div class="note" id="chartnote"></div></div>
  <div class="tabs"><button id="tabM" aria-selected="true" data-i="tabM">Aylık</button><button id="tabY" aria-selected="false" data-i="tabY">Çeyrek ve yıl</button><button id="tabS" aria-selected="false" data-i="tabS">Karne</button><button id="tabR" aria-selected="false" data-i="tabR">Çalıştırmadan beri</button></div>
  <div class="tbl"><table id="table"></table></div>
  <div class="note" id="tablenote"></div>
 </main>
</div>
<p class="disc" id="disc"></p>

function siteLang(){try{return localStorage.getItem('pa-lang')==='tr'?'tr':'en'}catch(e){return 'en'}}

const $=id=>document.getElementById(id);
const Z=0.6745;
function defaults(){ $('tariff').value=P.tariff; $('fx0').value=P.last_fx.toFixed(2); $('fx1').value=P.fx_dec26; $('fx2').value=P.fx_sep27; $('fxg').value=(P.fx_g*100).toFixed(2); $('kLR').value=P.kLR.toFixed(2); $('rk').value=P.rk; $('rg').value=P.rg; $('w').value=P.w; $('hyd').value="1"; $('cap').value=P.cap_ratio; $('newsOn').value="0"; P.news.forEach((e,k)=>{ $('n'+k).checked=true; $('np'+k).value=Math.round(e.p*100); $('ni'+k).value=Math.round(e.imp*100); }); }
function fxpath(h,fx0,fx1,fx2,g){ const m=P.months[h-1]; const idx=(m.y-2026)*12+m.m; // 1..=Jan-26
  const dec26=12, sep27=21; const h0=0; if(idx<=dec26) return fx0+(fx1-fx0)*(idx-10)/(dec26-10); if(idx<=sep27) return fx1+(fx2-fx1)*(idx-dec26)/9; return fx2*Math.pow(1+g,idx-sep27); }
function compute(inp){
  const G=inp.tariff/10.64/0.52/inp.fx0; const Gbar=P.Gbar; const out=[];
  const newsOn=inp.newsOn; const sel=inp.news;
  P.months.forEach((mo,i)=>{ const h=mo.j, m=mo.m;
    const Lh=(P.k12*Math.pow(inp.rk,h)+inp.kLR*(1-Math.pow(inp.rk,h)))*(G*Math.pow(inp.rg,h)+Gbar*(1-Math.pow(inp.rg,h)));
    const wh=Math.pow(inp.w,h); let hyd=(m>=3&&m<=6)?inp.hyd:1;
    let base=P.shape[m]*(wh*P.Dt+(1-wh)*Lh)*hyd;
    const sig=P.sigma*Math.sqrt(h/12); const sk=P.skew;
    let lo=base*Math.exp(-Z*sig*P.kband*(1+Math.max(0,-sk))), hi=base*Math.exp(Z*sig*P.kband*(1+Math.max(0,sk)));
    const c50=inp.cap*mo.cap50, c90=inp.cap*mo.cap90; base=Math.min(base,c50); lo=Math.min(lo,c50); hi=Math.min(hi,c90); lo=Math.min(lo,base); hi=Math.max(hi,base);
    let w=0.25*lo+0.5*base+0.25*hi;
    if(h===1){ w=0.5*w+0.5*P.last_usd; base=w; } if(h<=3){ const q=h===1?P.cal1:P.cal23; if(q){ lo=w*q[1]; hi=w*q[2]; } }
    let nf=1; if(newsOn){ let s=0; P.news.forEach((e,k)=>{ const u=sel[k]; if(u.on&&e.a<=h&&h<=e.b&&u.imp>-1) s+=u.p*Math.log(1+u.imp); }); nf=Math.exp(s); }
    const fx=fxpath(h,inp.fx0,inp.fx1,inp.fx2,inp.fxg);
    out.push({h,y:mo.y,m,hours:mo.hours,lo:lo*nf,base:base*nf,hi:hi*nf,w:w*nf,fx,eng:P.engine[i].w});
  }); return out; }
function readInputs(){ return {tariff:+$('tariff').value,fx0:+$('fx0').value,fx1:+$('fx1').value,fx2:+$('fx2').value,fxg:+$('fxg').value/100,kLR:+$('kLR').value,rk:+$('rk').value,rg:+$('rg').value,w:+$('w').value,hyd:+$('hyd').value,cap:+$('cap').value,newsOn:$('newsOn').value==="1",news:P.news.map((e,k)=>({on:$('n'+k).checked,p:(+$('np'+k).value||0)/100,imp:(+$('ni'+k).value||0)/100}))}; }
const f1=x=>L==='tr'?x.toFixed(1).replace('.',','):x.toFixed(1); const f0=x=>Math.round(x).toLocaleString(L==='tr'?'tr-TR':'en-GB'); const f2=x=>L==='tr'?x.toFixed(2).replace('.',','):x.toFixed(2);

function render(R){ const t=I[L]; const first=R[0]; const avg12=R.slice(0,12).reduce((s,r)=>s+r.w,0)/12; const e12=R.slice(0,12).reduce((s,r)=>s+r.eng,0)/12;
  const y27=R.filter(r=>r.y===2027); const c27=blk(R,y27,'w'), e27=blk(R,y27,'eng');

  // chart

  const RM={}; (REAL?REAL.months:[]).forEach(x=>{ if(x.complete&&x.ptf_usd_mwh!=null) RM[x.month]=x.ptf_usd_mwh; }); const aft=pad().concat([null],R.slice(0,26).map(r=>{const k=r.y+'-'+String(r.m).padStart(2,'0'); return RM[k]!=null?RM[k]:null;})); if(aft.some(v=>v!=null)) ds.splice(1,0,{label:t.actAfter,data:aft,borderColor:fg,borderDash:[2,3],borderWidth:2.5,pointRadius:3,tension:0});

  }catch(e){ $('chartnote').textContent='chart unavailable'; }
  $('chartnote').textContent=(engSame?t.chartnote.split(' · ').slice(0,3).join(' · '):t.chartnote)+(readInputs().newsOn?' · '+t.cnews:'');
  // table

  if(tab==='M'){ html='<thead><tr>'+t.th.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'; R.forEach(r=>{ html+=`<tr class="${r.m===12?'year':''}"><td>${lab(r.y,r.m)}</td><td>${r.h}</td><td>${f2(r.fx)}</td><td>${f1(r.lo)}</td><td>${f1(r.base)}</td><td>${f1(r.hi)}</td><td class="w">${f1(r.w)}</td><td>${f0(r.w*r.fx)}</td><td>${f1(r.eng)}</td><td style="color:${r.w-r.eng>0.05?'var(--good)':r.w-r.eng<-0.05?'var(--bad)':'inherit'}">${(r.w-r.eng>=0?'+':'−')+f1(Math.abs(r.w-r.eng))}</td></tr>`; }); html+='</tbody>'; $('tablenote').textContent=t.tablenote; }
  else if(tab==='Y'){ html='<thead><tr>'+t.thy.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'; const blocks=[]; for(let q=1;q<=4;q++) blocks.push(['Q'+q+'-27',R.filter(r=>r.y===2027&&Math.ceil(r.m/3)===q)]); for(let y=2027;y<=2030;y++) blocks.push(['Cal-'+String(y).slice(2),R.filter(r=>r.y===y)]);
    blocks.forEach(([nm,rows])=>{ const H=rows.reduce((s,r)=>s+r.hours,0); const tl=rows.reduce((s,r)=>s+r.w*r.fx*r.hours,0)/H; const w=blk(R,rows,'w'), e=blk(R,rows,'eng'); html+=`<tr class="${nm.startsWith('Cal')?'year':''}"><td>${nm}</td><td>${H}</td><td>${f1(blk(R,rows,'lo'))}</td><td>${f1(blk(R,rows,'base'))}</td><td>${f1(blk(R,rows,'hi'))}</td><td class="w">${f1(w)}</td><td>${f0(tl)}</td><td>${f1(e)}</td><td>${(w-e>=0?'+':'−')+f1(Math.abs(w-e))}</td></tr>`; }); html+='</tbody>'; $('tablenote').textContent=t.tablenote; }
  else if(tab==='R'){ const RM2={}; (REAL?REAL.months:[]).forEach(x=>{ if(x.complete&&x.ptf_usd_mwh!=null) RM2[x.month]=x.ptf_usd_mwh; }); const rows=R.filter(r=>RM2[r.y+'-'+String(r.m).padStart(2,'0')]!=null); html='<thead><tr>'+t.thr.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'; let ae=0,cv=0; rows.forEach(r=>{ const a=RM2[r.y+'-'+String(r.m).padStart(2,'0')]; const d=a-r.w; ae+=Math.abs(d); const inb=a>=r.lo&&a<=r.hi; if(inb) cv++; html+=`<tr><td>${lab(r.y,r.m)}</td><td class="w">${f1(r.w)}</td><td>${f1(a)}</td><td style="color:${d>=0?'var(--good)':'var(--bad)'}">${(d>=0?'+':'−')+f1(Math.abs(d))}</td><td>${inb?t.yes:t.no}</td></tr>`; }); html+='</tbody>'; $('tablenote').textContent=rows.length? t.rNote.replace('{c}',P.cut).replace('{n}',rows.length).replace('{mae}',f1(ae/rows.length)).replace('{cov}',Math.round(100*cv/rows.length)) : t.rNone.replace('{c}',P.cut); }

function applyLang(){ if(!P) return; const t=I[L]; document.querySelectorAll('[data-i]').forEach(el=>{ const k=el.dataset.i; if(t[k]!=null){ if(el.tagName==='LABEL'&&el.querySelector('small')){ el.childNodes[0].textContent=t[k]+' '; if(t.tips[k]){ el.dataset.tip=t.tips[k]; el.tabIndex=0; } if(t.subs[k]) el.querySelector('small').textContent=t.subs[k]; } else el.textContent=t[k]; } });
