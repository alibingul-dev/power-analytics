<html lang="en" data-noi18n>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Price Outlook Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;
 --bg:#0E1520;--card:#16202E;--surface-2:#1D2A3B;--line:#26364B;--fg:#E6EDF5;--muted:#8A9BB0;--accent:#FBBF24;--navy:#38BDF8;--good:#34D399;--bad:#F43F5E;--band:rgba(56,189,248,.14);--input:#1D2A3B;
 --font:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;--display:Archivo,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:clip}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;padding:24px clamp(16px,3vw,48px) 60px;-webkit-font-smoothing:antialiased}
h1{font-family:var(--display);font-size:28px;margin:0;font-weight:800;letter-spacing:-.02em}
h2{font-family:var(--display);font-size:15px;margin:0 0 10px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin:0 0 16px}
.sub{color:var(--muted);font-size:14px;max-width:90ch}
.wrap{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px}
@media (max-width:980px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.rail{display:flex;flex-direction:column;gap:16px}
.row{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;margin-bottom:8px}
.row label{font-size:13.5px;color:var(--fg)}
.row small{display:block;color:var(--muted);font-size:11.5px}
.row label[data-tip]{position:relative;cursor:help;text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.row label[data-tip]:hover::after,.row label[data-tip]:focus::after{content:attr(data-tip);position:absolute;left:0;top:100%;margin-top:6px;z-index:50;width:min(280px,80vw);padding:8px 10px;background:var(--surface-2);border:1px solid var(--navy);border-radius:6px;color:var(--fg);font-size:12.5px;line-height:1.4;white-space:normal;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.45)}
input[type=number],select{width:100%;font:500 14px var(--mono);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--fg)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.adv{margin:4px 0 12px;border-top:1px solid var(--line);padding-top:8px}
.adv summary{cursor:pointer;font-size:13px;color:var(--muted);margin-bottom:8px}
.adv[open] summary{color:var(--fg)}
button{font:600 13px var(--font);padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer}
button.primary{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font:500 22px/1.1 var(--mono);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:16px}
canvas{max-width:100%}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button[aria-selected=true]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--surface-2);color:var(--fg);font-weight:600;text-align:right;padding:8px 10px;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:6px 10px;border-top:1px solid var(--line);text-align:right;font-family:var(--mono)}
td.w{font-weight:500;background:var(--band)}
tr.year td{font-weight:500}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.pill.calm{background:rgba(52,211,153,.15);color:var(--good)}.pill.stormy{background:rgba(244,63,94,.15);color:var(--bad)}
.news{display:flex;flex-direction:column;gap:6px;font-size:13px}
.news .nrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.news label{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:center}
.news .m{display:flex;align-items:center;gap:3px;font-family:var(--mono);color:var(--muted);font-size:12px}
.news .m input{width:52px;padding:3px 4px;font-size:12px}
.news .m em{font-style:normal;margin-right:4px}
.diff{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
.disc{font-size:12px;color:var(--muted);margin:18px 0 0;max-width:120ch}
.lang{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

  const cs=getComputedStyle(document.documentElement); const navy=cs.getPropertyValue('--navy').trim(), fg=cs.getPropertyValue('--fg').trim(), muted=cs.getPropertyValue('--muted').trim(), band=cs.getPropertyValue('--band').trim(), line=cs.getPropertyValue('--line').trim();
  const ds=[{label:L==='tr'?'Gerçekleşen':'Actual',data:act,borderColor:fg,borderWidth:2.5,pointRadius:2,tension:0},
            {label:L==='tr'?'Beklenen':'Expected',data:exp,borderColor:navy,borderWidth:2.5,pointRadius:0,tension:0},
            {label:L==='tr'?'Yüksek':'High',data:hi,borderColor:navy,borderDash:[4,4],borderWidth:1.2,pointRadius:0,fill:'+1',backgroundColor:band,tension:0},
            {label:L==='tr'?'Düşük':'Low',data:lo,borderColor:navy,borderDash:[4,4],borderWidth:1.2,pointRadius:0,tension:0},
            {label:L==='tr'?'Motor':'Engine',data:eng,borderColor:muted,borderWidth:1.5,pointRadius:0,tension:0}];
  const engSame=Math.max(...R.slice(0,26).map(r=>Math.abs(r.w-r.eng)))<0.3; if(engSame) ds.pop();
  try{ if(chart) chart.destroy();
  chart=new Chart($('chart'),{type:'line',data:{labels,datasets:ds},options:{responsive:true,animation:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:fg,boxWidth:14}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+(c.parsed.y==null?'':f1(c.parsed.y))+' $/MWh'}}},scales:{x:{ticks:{color:muted,maxRotation:0,autoSkip:true},grid:{color:line}},y:{title:{display:true,text:'$/MWh',color:muted},ticks:{color:muted},grid:{color:line}}}}});
  }catch(e){ $('chartnote').textContent='chart unavailable'; }
  $('chartnote').textContent=(engSame?t.chartnote.split(' · ').slice(0,3).join(' · '):t.chartnote)+(readInputs().newsOn?' · '+t.cnews:'');
  // table
  let html='';
  if(tab==='M'){ html='<thead><tr>'+t.th.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'; R.forEach(r=>{ html+=`<tr class="${r.m===12?'year':''}"><td>${lab(r.y,r.m)}</td><td>${r.h}</td><td>${f2(r.fx)}</td><td>${f1(r.lo)}</td><td>${f1(r.base)}</td><td>${f1(r.hi)}</td><td class="w">${f1(r.w)}</td><td>${f0(r.w*r.fx)}</td><td>${f1(r.eng)}</td><td style="color:${r.w-r.eng>0.05?'var(--good)':r.w-r.eng<-0.05?'var(--bad)':'inherit'}">${(r.w-r.eng>=0?'+':'−')+f1(Math.abs(r.w-r.eng))}</td></tr>`; }); html+='</tbody>'; $('tablenote').textContent=t.tablenote; }
  else if(tab==='Y'){ html='<thead><tr>'+t.thy.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'; const blocks=[]; for(let q=1;q<=4;q++) blocks.push(['Q'+q+'-27',R.filter(r=>r.y===2027&&Math.ceil(r.m/3)===q)]); for(let y=2027;y<=2030;y++) blocks.push(['Cal-'+String(y).slice(2),R.filter(r=>r.y===y)]);
    blocks.forEach(([nm,rows])=>{ const H=rows.reduce((s,r)=>s+r.hours,0); const tl=rows.reduce((s,r)=>s+r.w*r.fx*r.hours,0)/H; const w=blk(R,rows,'w'), e=blk(R,rows,'eng'); html+=`<tr class="${nm.startsWith('Cal')?'year':''}"><td>${nm}</td><td>${H}</td><td>${f1(blk(R,rows,'lo'))}</td><td>${f1(blk(R,rows,'base'))}</td><td>${f1(blk(R,rows,'hi'))}</td><td class="w">${f1(w)}</td><td>${f0(tl)}</td><td>${f1(e)}</td><td>${(w-e>=0?'+':'−')+f1(Math.abs(w-e))}</td></tr>`; }); html+='</tbody>'; $('tablenote').textContent=t.tablenote; }
  else { html='<thead><tr>'+t.ths.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'; let b=0; P.score.forEach(s=>{ const [y,m]=s.k.split('-'); const d=s.act-s.said; b+=d; html+=`<tr><td>${lab(+y,+m)}</td><td>${f1(s.said)}</td><td>${f1(s.act)}</td><td style="color:${d>=0?'var(--good)':'var(--bad)'}">${(d>=0?'+':'−')+f1(Math.abs(d))}</td></tr>`; }); html+='</tbody>'; $('tablenote').textContent=t.scoreN.replace('{b}',(b/P.score.length>=0?'+':'−')+f1(Math.abs(b/P.score.length))); }
  $('table').innerHTML=html; }
function applyLang(){ const t=I[L]; document.querySelectorAll('[data-i]').forEach(el=>{ const k=el.dataset.i; if(t[k]!=null){ if(el.tagName==='LABEL'&&el.querySelector('small')){ el.childNodes[0].textContent=t[k]+' '; if(t.tips[k]){ el.dataset.tip=t.tips[k]; el.tabIndex=0; } if(t.subs[k]) el.querySelector('small').textContent=t.subs[k]; } else el.textContent=t[k]; } });
  $('subtitle').textContent=t.sub.replace('{cut}',P.cut); $('disc').textContent=t.disc; $('langTR').setAttribute('aria-pressed',L==='tr'); $('langEN').setAttribute('aria-pressed',L==='en');
  document.querySelectorAll('#newsList label span.t').forEach((s,k)=>{ s.textContent=L==='tr'?P.news[k].tr:NEWS_EN[P.news[k].id]; });
  // verify
  const sv=readInputs(); const R0=compute(Object.assign({},sv,{tariff:P.tariff,fx0:P.last_fx,fx1:P.fx_dec26,fx2:P.fx_sep27,fxg:P.fx_g,kLR:P.kLR,rk:P.rk,rg:P.rg,w:P.w,hyd:1,cap:P.cap_ratio,newsOn:false})); }
function run(){ render(compute(readInputs())); }
P.news.forEach((e,k)=>{ const l=document.createElement('div'); l.className='nrow'; l.innerHTML=`<label><input type="checkbox" id="n${k}" checked><span class="t"></span></label><span class="m"><input type="number" id="np${k}" value="${Math.round(e.p*100)}" min="0" max="100" step="5" aria-label="probability %"><em>%</em><input type="number" id="ni${k}" value="${Math.round(e.imp*100)}" min="-50" max="50" step="1" aria-label="impact %"><em>%</em></span>`; $('newsList').appendChild(l); });
$('newsList').addEventListener('change',run);
defaults(); applyLang(); run();
['tariff','fx0','fx1','fx2','fxg','kLR','rk','rg','w','hyd','cap','newsOn'].forEach(id=>$(id).addEventListener('change',run)); 
$('run').onclick=run; $('reset').onclick=()=>{defaults();run();};
$('langTR').onclick=()=>{L='tr';applyLang();run();}; $('langEN').onclick=()=>{L='en';applyLang();run();};
[['tabM','M'],['tabY','Y'],['tabS','S']].forEach(([id,v])=>$(id).onclick=()=>{tab=v;document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.id===id));run();});
</script>
