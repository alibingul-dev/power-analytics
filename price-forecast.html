<!doctype html>
<html lang="en" data-noi18n>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Price Forecast</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;
 --bg:#0E1520;--card:#16202E;--surface-2:#1D2A3B;--line:#26364B;--fg:#E6EDF5;--muted:#8A9BB0;--accent:#FBBF24;--navy:#38BDF8;--good:#34D399;--bad:#F43F5E;--band:rgba(56,189,248,.14);--input:#1D2A3B;
 --font:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;--display:Archivo,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:clip}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;padding:24px clamp(16px,3vw,48px) 60px;-webkit-font-smoothing:antialiased}
h1{font-family:var(--display);font-size:28px;margin:0;font-weight:800;letter-spacing:-.02em}
h2{font-family:var(--display);font-size:15px;margin:0 0 10px;font-weight:600;color:var(--muted)}
.sub{color:var(--muted);font-size:14px;max-width:95ch;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:12px}
.ctl label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input[type=date],select{font:500 14px var(--mono);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--fg)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
button{font:600 13px var(--font);padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font:500 22px/1.15 var(--mono);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.good{color:var(--good)}.bad{color:var(--bad)}
.cbox{position:relative;height:300px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{background:var(--surface-2);font-weight:600;text-align:right;padding:7px 10px;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:5px 10px;border-top:1px solid var(--line);text-align:right;font-family:var(--mono)}
.why p{margin:0 0 8px;font-size:14px}
.why ul{margin:0 0 8px;padding-left:18px;font-size:14px}
.why li{margin-bottom:4px}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.disc{font-size:12.5px;color:var(--muted);margin:20px 0 0;max-width:120ch}
.method p{font-size:14px;margin:0 0 8px;max-width:110ch}
.lock{max-width:560px;margin:12vh auto;text-align:center}.lock a{color:var(--navy)}
.mono{font-family:var(--mono)}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.cur{display:flex;gap:4px}.cur button{padding:6px 10px}.cur button[aria-pressed=true]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:rgba(251,191,36,.15);color:var(--accent);border:1px solid rgba(251,191,36,.4)}
.tag.hit{background:rgba(244,63,94,.15);color:var(--bad);border-color:rgba(244,63,94,.4)}
.tag.off{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
td .tag{padding:1px 8px;font-size:11.5px}
td.dim,th.dim{color:var(--muted)}
tr.avg td{font-weight:500;background:var(--band)}
table.lbl td:first-child{font-family:var(--font);white-space:nowrap}table.lbl th{white-space:normal;min-width:84px}
caption{text-align:left;padding:8px 10px;font-weight:600;color:var(--fg);background:var(--surface-2);caption-side:top}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>
<div id="app" hidden>
  <div class="top"><h1 id="t-title"></h1><div class="cur" id="cur" hidden><button type="button" data-cur="try" aria-pressed="true">TL</button><button type="button" data-cur="usd">USD</button><button type="button" data-cur="eur">EUR</button></div></div>
  <div class="sub" id="t-sub"></div>

  <div class="panel" id="livep" style="margin-top:16px;border-color:var(--navy)">
    <div class="ctl" style="justify-content:space-between"><h2 id="t-live" style="margin:0"></h2><span id="ltag"></span></div>
    <p class="note" id="t-livenote" style="margin:0 0 10px"></p>
    <div class="grid2">
      <div class="cbox" style="height:260px"><canvas id="cLive" role="img"></canvas></div>
      <div class="tbl" style="margin:0;max-height:260px;overflow:auto"><table id="livet"></table></div>
    </div>
    <p class="note" id="t-livedisc"></p>
  </div>

  <div class="panel">
    <h2 id="t-range"></h2>
    <div class="ctl">
      <label><span id="t-from"></span><input type="date" id="from"></label>
      <label><span id="t-to"></span><input type="date" id="to"></label>
      <button type="button" id="all"></button>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="cbox"><canvas id="cDaily" role="img"></canvas></div>
    <p class="note" id="t-dailynote"></p><p class="note" id="t-tlonly" hidden></p>
  </div>

  <div class="panel">
    <h2 id="t-score"></h2>
    <p class="note" id="t-devnote" style="margin:0 0 10px"></p>
    <h2 id="t-bands"></h2><div class="tbl"><table id="bands" class="lbl"></table></div><p class="note" id="t-bandnote" style="margin-bottom:16px"></p>
    <h2 id="t-ramps"></h2><div class="tbl"><table id="ramps" class="lbl"></table></div><p class="note" id="t-rampnote"></p>
    <p class="note" id="t-defs"></p>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2 id="t-day"></h2>
      <div class="ctl"><label><span id="t-pick"></span><select id="day"></select></label><span id="ytag"></span><span id="stag"></span></div>
      <div class="cbox"><canvas id="cDay" role="img"></canvas></div>
      <p class="note" id="t-daynote"></p>
    </div>
    <div class="panel why">
      <h2 id="t-why"></h2>
      <div id="why"></div>
      <div class="cbox" style="height:240px"><canvas id="cWhy" role="img"></canvas></div>
      <p class="note" id="t-whynote"></p>
    </div>
  </div>

  <div class="panel">
    <div class="ctl" style="justify-content:space-between"><h2 id="t-hours" style="margin:0"></h2><button type="button" id="dl"></button></div>
    <div class="tbl"><table id="hours"></table></div>
    <p class="note" id="t-whycol"></p>
    <p class="note" id="t-yknote"></p>
    <p class="note" id="t-snote"></p>
    <p class="note" id="t-dlnote"></p>
  </div>

  <div class="panel method">
    <h2 id="t-method"></h2>
    <div id="method"></div>
  </div>

  <p class="disc" id="t-disc"></p>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
function siteLang(){try{return localStorage.getItem("pa-lang")==="tr"?"tr":"en"}catch(e){return "en"}}
let L=siteLang(),D=null,DAYS=[],cD=null,cH=null,cW=null;
let CUR="try";try{CUR=localStorage.getItem("pa-dpf-cur")||"try"}catch(e){}

const uu=str=>CUR==="try"?str:str.replace(/TL\/MWh/g,U());
const nC=v=>CUR==="try"?n0(v):n1(v);
const SUM=()=>CUR==="try"?D.summary:((D.summary_fx||{})[CUR]||D.summary);

const T={
en:{title:"Daily Price Forecast",
 sub:"A next-day forecast of Türkiye's day-ahead price (PTF), hour by hour, scored against what the price actually did. Each forecast uses the EPİAŞ load plan and wind forecast as archived the day before; the archive time is shown for every day, and days archived after the 12:30 market close are flagged, because those inputs may have been revised after clearing. Today's forecast for tomorrow is not shown: this page is a track record, not a trading signal.",
 range:"Track record",from:"From",to:"To",all:"Whole history",

/* ---------- Pro gate: data ships inside the encrypted tier bundles ---------- */
const b64u8=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function loadData(){
  let code=null;try{code=localStorage.getItem("pa-pro")}catch(e){}
  if(!code)throw new Error("nocode");
  const te=new TextEncoder(),sub=crypto.subtle;let wk=null,salt=null;
  for(const tier of["custom","ultra","max","pro"]){
    let B;try{const r=await fetch(tier+".bundle.json",{cache:"no-store"});if(!r.ok)continue;B=await r.json()}catch(e){continue}
    if(!wk||salt!==B.kdf.salt){salt=B.kdf.salt;const base=await sub.importKey("raw",te.encode(code),"PBKDF2",false,["deriveKey"]);
      wk=await sub.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:b64u8(B.kdf.salt),iterations:B.kdf.iter},base,{name:"AES-GCM",length:256},false,["decrypt"])}
    for(const k of B.keys){let raw;try{raw=await sub.decrypt({name:"AES-GCM",iv:b64u8(k.iv)},wk,b64u8(k.ct))}catch(e){continue}
      const ck=await sub.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
      const d=JSON.parse(new TextDecoder().decode(await sub.decrypt({name:"AES-GCM",iv:b64u8(B.iv)},ck,b64u8(B.ct))));
      if(d.dpf&&d.dpf.days)return d.dpf}
  }
  throw new Error("badcode");
}

function kpis(rows){
  const x=t();
  if(!rows.length){$("kpis").innerHTML='<div class="kpi"><div class="l">'+x.empty+'</div></div>';return}
  const rr=rows.filter(r=>rate(r));if(!rr.length){$("kpis").innerHTML='<div class="kpi"><div class="l">'+x.fxmissing+'</div></div>';return}
  const c=(r,k)=>r[k]/rate(r);
  const m=avg(rr.map(r=>c(r,"mae"))),d1=avg(rr.map(r=>c(r,"mae_d1"))),d7=avg(rr.map(r=>c(r,"mae_d7"))),b=avg(rr.map(r=>c(r,"bias")));
  const beat=rr.filter(r=>r.mae<r.mae_d1).length,pct=100*beat/rr.length,rows_n=rr.length;
  const k=(l,v,d,cls)=>'<div class="kpi"><div class="l">'+l+'</div><div class="v '+(cls||"")+'">'+v+'</div><div class="d">'+d+'</div></div>';
  $("kpis").innerHTML=
    k(x.k_mae,nC(m)+" "+U(),x.d_mae,m<d1?"good":"bad")+
    k(x.k_d1,nC(d1)+" "+U(),x.d_naive)+
    k(x.k_d7,nC(d7)+" "+U(),x.d_naive)+
    k(x.k_beat,n0(pct)+"%",fill(x.d_beat,{n:n0(rows_n)}),pct>=50?"good":"bad")+
    k(x.k_bias,(b>0?"+":"")+nC(b)+" "+U(),x.d_bias);
}

  const R=S.ramps;let g='<thead><tr>'+x.rh.map(c=>'<th>'+uu(c)+'</th>').join("")+'</tr></thead><tbody>';
  [["up",R.up,R.up_from],["down",R.down,R.down_from],["flat",R.flat,null],["fc_up",R.fc_up,R.fc_up_from],["fc_down",R.fc_down,R.fc_down_from]].forEach(([k,c,v])=>{if(!c||!c.hours)return;
    g+='<tr><td>'+uu(fill(x.rl[k],{v:nC(v)}))+'</td><td>'+n0(c.hours)+'</td><td>'+nC(c.mae)+'</td><td>'+pct(c.bsr)+'</td><td>'+pct(c.wsr)+'</td><td>'+(c.slope_act>0?"+":"")+nC(c.slope_act)+'</td><td>'+(c.slope_fc>0?"+":"")+nC(c.slope_fc)+'</td><td>'+(k==="flat"?"—":n2(c.slope_ratio))+'</td></tr>'});
  $("ramps").innerHTML=g+'</tbody>';
  const Y=S.yekdem||{},T0=D.summary;
  $("t-defs").textContent=uu(x.defs)+" "+fill(x.ynote,{f:n0(Y.days_flagged),d:n0(S.days),h:n0(Y.days_hit),miss:n0(Y.days_missed)});
  const MO=T0.mo||{};$("t-snote").textContent=MO.steep_from!=null?fill(x.snote,{thr:n0(MO.steep_from),a:n0(MO.steep_dptf),b:n0(MO.flat_dptf)}):"";
}

function csv(){
  const cols=["date","hour","forecast_tl_mwh","actual_tl_mwh","miss_tl_mwh","naive_d1_tl_mwh","naive_d7_tl_mwh","netload_fc_gw","netload_act_gw","late_capture","usdtry","eurtry","yekdem_risk","yekdem_actual","model_version"];
  const out=[cols.join(",")];
  DAYS.forEach(r=>{const rh=(r.yekdem||{}).risk_hours||[],ah=(r.yekdem||{}).actual_hours||[];
    for(let h=0;h<24;h++)out.push([r.date,h,r.fc[h],r.actual[h],(r.fc[h]-r.actual[h]).toFixed(1),r.naive_d1[h],r.naive_d7[h],r.netload_fc[h],r.netload_act?r.netload_act[h]:"",r.late_capture?1:0,r.fx?r.fx.usd:"",r.fx?r.fx.eur:"",rh.includes(h)?1:0,ah.includes(h)?1:0,D.version].join(","))});
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+out.join("\r\n")],{type:"text/csv;charset=utf-8"}));a.download="daily-price-forecast-"+DAYS[DAYS.length-1].date+".csv";document.body.appendChild(a);a.click();a.remove();
}

function why(r,hrs){
  const x=t(),w=r.why;if(cW){cW.destroy();cW=null}
  const Uw=rate(r)?U():"TL/MWh",cu=str=>rate(r)?uu(str):str,f=v=>nP(v,r);
  let s='<p>'+cu(fill(x.w_miss,{mae:f(r.mae),bias:f(Math.abs(r.bias)),dir:r.bias>0?x.w_high:x.w_low}))+'</p>';
  if(!w){$("why").innerHTML=s+'<p class="note">'+x.nowhy+'</p>';$("cWhy").parentElement.hidden=true;return}
  $("cWhy").parentElement.hidden=false;
  const ma=a=>avg(a.map(Math.abs));
  s+='<p>'+cu(fill(x.w_parts,{ld:f(ma(w.c_load)),wd:f(ma(w.c_wind)),perf:f(w.mae_perfect_inputs)}))+'</p>';
  s+='<p><b>'+x.w_hit+'</b></p><ul>';
  const fs=w.flat_shift||{};
  const LIM=3;
  [["netload",x.w_shift_nl,x.what_nl]].forEach(([k,tx,what])=>{const g=fs[k];if(!g)return;
    if(Math.abs(g.delta_gw)<=LIM&&g.mae_after<r.mae*0.9)s+='<li>'+cu(fill(tx,{gw:n2(Math.abs(g.delta_gw)),dir:g.delta_gw>0?x.up:x.down,after:f(g.mae_after)}))+'</li>';
    else s+='<li>'+fill(x.w_noshift,{what:what,lim:n0(LIM)})+'</li>';});
  s+='<li>'+x.w_overfit+'</li></ul>';
  $("why").innerHTML=s;
  const kk=rate(r)||1,cv=a=>a.map(v=>v/kk);
  cW=new Chart($("cWhy"),{type:"bar",data:{labels:hrs,datasets:[
    {label:x.c_load,data:cv(w.c_load),backgroundColor:C.nl,stack:"s"},
    {label:x.c_wind,data:cv(w.c_wind),backgroundColor:C.fc,stack:"s"},
    {label:x.c_left,data:cv(w.unexplained),backgroundColor:C.left,stack:"s"}]},
    options:Object.assign(base(Uw),{scales:Object.assign(base(Uw).scales,{x:{stacked:true,ticks:{color:C.tick,maxRotation:0,autoSkip:true},grid:{color:C.grid}},y:{stacked:true,title:{display:true,text:Uw,color:C.tick},ticks:{color:C.tick,callback:v=>Uw==="TL/MWh"?n0(v):n1(v)},grid:{color:C.grid}}})})});
}

function method(){
  const x=t(),c=D.latest_coef||{};
  const parts=Object.keys(x.coef).filter(k=>c[k]!=null).map(k=>fill(x.coef[k],{v:k==="p_d1"||k==="p_d7"?n2(c[k]):n0(c[k])}));
  const MO=D.summary.mo||{};
  const moTxt=MO.mae_mo!=null?fill(x.m_mo,{mo:n0(MO.mae_mo),d7:n0(MO.mae_d7_same_days)}):"";
  $("method").innerHTML=x.m.map(p=>'<p>'+fill(p,{n:n0(D.method.train_days),n2:n0(D.summary.days),late:n0(D.summary.late_capture_days),coef:parts.join(" · "),mo:moTxt})+'</p>').join("");
}

function texts(){
  const x=t();document.documentElement.lang=L;document.title=x.title;
  ["title","sub","range","from","to","day","pick","why","hours","method","disc","score","bands","ramps","bandnote","rampnote","dlnote"].forEach(k=>{const e=$("t-"+k);if(e)e.textContent=x[k]});
  $("all").textContent=x.all;$("dl").textContent=x.dl;$("t-daynote").textContent="";$("t-yknote").textContent=x.yknote;$("t-whycol").textContent=x.whycol;
  $("t-tlonly").hidden=true;$("t-dailynote").textContent=x.dailynote;$("t-daynote").textContent=x.daynote;$("t-whynote").textContent=x.whynote;
  const cur=$("day").value;
  $("day").innerHTML=DAYS.slice().reverse().map(r=>'<option value="'+r.date+'">'+dlab(r.date)+' · '+nP(r.mae,r)+' '+(rate(r)?U():"TL/MWh")+(r.late_capture?' · ⚠':'')+'</option>').join("");
  if(cur)$("day").value=cur;
}

let cL=null;
function liveView(){
  const x=t();let L=D.live;const P=$("livep");
  const tom=new Date(Date.now()+3*3600e3+86400e3).toISOString().slice(0,10);   // tomorrow in Europe/Istanbul (UTC+3)
  if(L&&L.date!==tom)L=null;
  if(!L||!L.fc){$("t-live").textContent=x.live_none;$("ltag").className="";$("ltag").textContent="";
    $("t-livenote").textContent=fill(x.livenone,{d:DAYS.length?dlab(DAYS[DAYS.length-1].date):"—"});$("cLive").parentElement.hidden=true;$("livet").parentElement.hidden=true;$("t-livedisc").textContent="";return}
  $("cLive").parentElement.hidden=false;$("livet").parentElement.hidden=false;
  const hrs=[...Array(24).keys()].map(h=>String(h).padStart(2,"0")+":00");
  const k=rate(L)||1,Ul=rate(L)?U():"TL/MWh";
  $("t-live").textContent=fill(x.live,{d:dlab(L.date)});
  const at=new Date(L.made_at).toLocaleString(loc(),{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}),cap=new Date(L.captured_at).toLocaleString(loc(),{hour:"2-digit",minute:"2-digit"});
  $("t-livenote").textContent=fill(x.livenote,{at:at,cap:cap})+(CUR!=="try"&&L.fx?" "+fill(x.fxnote,{u:CUR.toUpperCase(),k:n2(L.fx[CUR])}):"");
  $("t-livedisc").textContent=x.livedisc;
  const rh=(L.yekdem||{}).risk_hours||[],el=$("ltag");
  if(rh.length){el.className="tag";el.textContent=fill(x.ytag_risk,{n:rh.length})}else{el.className="tag off";el.textContent=x.ytag_off}
  if(cL)cL.destroy();
  cL=new Chart($("cLive"),{type:"line",data:{labels:hrs,datasets:[{label:x.s_fc,data:L.fc.map(v=>v/k),borderColor:C.fc,backgroundColor:C.fc,pointRadius:2,borderWidth:2}]},options:base(Ul)});
  let h='<thead><tr><th>'+x.lh[0]+'</th><th>'+x.lh[1]+' ('+Ul+')</th><th>'+x.lh[2]+'</th></tr></thead><tbody>';
  for(let i=0;i<24;i++){const fl=rh.includes(i);h+='<tr'+(fl?' style="box-shadow:inset 3px 0 var(--accent)"':'')+'><td>'+hrs[i]+'</td><td>'+nP(L.fc[i],L)+'</td><td style="font-family:var(--font)">'+(fl?'<span class="tag">'+x.yk_risk+'</span>':'<span class="dim">—</span>')+'</td></tr>'}
  h+='<tr class="avg"><td>'+x.avg+'</td><td>'+nP(avg(L.fc),L)+'</td><td style="font-family:var(--font)">'+n0(rh.length)+'</td></tr>';
  $("livet").innerHTML=h+'</tbody>';
}
function render(){liveView();const rows=inRange();kpis(rows);drawDaily(rows);score();drawDay();method()}

function init(dpf){
  D=dpf;DAYS=(dpf.days||[]).filter(r=>r.actual&&r.mae!=null);
  if(!DAYS.length){$("app").hidden=false;texts();$("kpis").innerHTML='<div class="kpi"><div class="l">'+t().empty+'</div></div>';return}
  const f=DAYS[0].date,l=DAYS[DAYS.length-1].date;
  ["from","to"].forEach(id=>{$(id).min=f;$(id).max=l});
  $("from").value=f;$("to").value=l;
  $("app").hidden=false;texts();$("day").value=l;render();
  $("from").onchange=$("to").onchange=render;
  $("all").onclick=()=>{$("from").value=f;$("to").value=l;render()};
  $("day").onchange=drawDay;$("dl").onclick=csv;
  const hasFx=DAYS.some(r=>r.fx&&r.fx.usd&&r.fx.eur);
  if(hasFx){$("cur").hidden=false;[...document.querySelectorAll("#cur button")].forEach(b=>{b.setAttribute("aria-pressed",b.dataset.cur===CUR);
    b.onclick=()=>{CUR=b.dataset.cur;try{localStorage.setItem("pa-dpf-cur",CUR)}catch(e){}[...document.querySelectorAll("#cur button")].forEach(z=>z.setAttribute("aria-pressed",z.dataset.cur===CUR));texts();render()}})}
  else CUR="try";
}

window.addEventListener("storage",e=>{if(e.key==="pa-lang"&&D){L=siteLang();texts();render()}});
loadData().then(init).catch(e=>locked(e.message));
})();
</script>
