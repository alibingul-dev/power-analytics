<!doctype html>
<html lang="en" data-noi18n>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Price Forecast</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;
 --bg:#0E1520;--card:#16202E;--surface-2:#1D2A3B;--line:#26364B;--fg:#E6EDF5;--muted:#8A9BB0;--accent:#FBBF24;--navy:#38BDF8;--good:#34D399;--bad:#F43F5E;--band:rgba(56,189,248,.14);--input:#1D2A3B;
 --font:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;--display:Archivo,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:clip}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;padding:24px clamp(16px,3vw,48px) 60px;-webkit-font-smoothing:antialiased}
h1{font-family:var(--display);font-size:28px;margin:0;font-weight:800;letter-spacing:-.02em}
h2{font-family:var(--display);font-size:15px;margin:0 0 10px;font-weight:600;color:var(--muted)}
.sub{color:var(--muted);font-size:14px;max-width:95ch;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:12px}
.ctl label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input[type=date],select{font:500 14px var(--mono);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--fg)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
button{font:600 13px var(--font);padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font:500 22px/1.15 var(--mono);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.good{color:var(--good)}.bad{color:var(--bad)}
.cbox{position:relative;height:300px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{background:var(--surface-2);font-weight:600;text-align:right;padding:7px 10px;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:5px 10px;border-top:1px solid var(--line);text-align:right;font-family:var(--mono)}
.why p{margin:0 0 8px;font-size:14px}
.why ul{margin:0 0 8px;padding-left:18px;font-size:14px}
.why li{margin-bottom:4px}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.disc{font-size:12.5px;color:var(--muted);margin:20px 0 0;max-width:120ch}
.method p{font-size:14px;margin:0 0 8px;max-width:110ch}
.lock{max-width:560px;margin:12vh auto;text-align:center}.lock a{color:var(--navy)}
.mono{font-family:var(--mono)}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:rgba(251,191,36,.15);color:var(--accent);border:1px solid rgba(251,191,36,.4)}
.tag.hit{background:rgba(244,63,94,.15);color:var(--bad);border-color:rgba(244,63,94,.4)}
.tag.off{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
td.dim,th.dim{color:var(--muted)}
tr.avg td{font-weight:500;background:var(--band)}
table.lbl td:first-child{font-family:var(--font);white-space:nowrap}table.lbl th{white-space:normal;min-width:84px}
caption{text-align:left;padding:8px 10px;font-weight:600;color:var(--fg);background:var(--surface-2);caption-side:top}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>
<div id="app" hidden>
  <h1 id="t-title"></h1>
  <div class="sub" id="t-sub"></div>

  <div class="panel" style="margin-top:16px">
    <h2 id="t-range"></h2>
    <div class="ctl">
      <label><span id="t-from"></span><input type="date" id="from"></label>
      <label><span id="t-to"></span><input type="date" id="to"></label>
      <button type="button" id="all"></button>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="cbox"><canvas id="cDaily" role="img"></canvas></div>
    <p class="note" id="t-dailynote"></p>
  </div>

  <div class="panel">
    <h2 id="t-score"></h2>
    <p class="note" id="t-devnote" style="margin:0 0 10px"></p>
    <h2 id="t-bands"></h2><div class="tbl"><table id="bands" class="lbl"></table></div><p class="note" id="t-bandnote" style="margin-bottom:16px"></p>
    <h2 id="t-ramps"></h2><div class="tbl"><table id="ramps" class="lbl"></table></div><p class="note" id="t-rampnote"></p>
    <p class="note" id="t-defs"></p>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2 id="t-day"></h2>
      <div class="ctl"><label><span id="t-pick"></span><select id="day"></select></label><span id="ytag"></span></div>
      <div class="cbox"><canvas id="cDay" role="img"></canvas></div>
      <p class="note" id="t-daynote"></p>
    </div>
    <div class="panel why">
      <h2 id="t-why"></h2>
      <div id="why"></div>
      <div class="cbox" style="height:240px"><canvas id="cWhy" role="img"></canvas></div>
      <p class="note" id="t-whynote"></p>
    </div>
  </div>

  <div class="panel">
    <div class="ctl" style="justify-content:space-between"><h2 id="t-hours" style="margin:0"></h2><button type="button" id="dl"></button></div>
    <div class="tbl"><table id="hours"></table></div>
    <p class="note" id="t-dlnote"></p>
  </div>

  <div class="panel method">
    <h2 id="t-method"></h2>
    <div id="method"></div>
  </div>

  <p class="disc" id="t-disc"></p>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
function siteLang(){try{return localStorage.getItem("pa-lang")==="tr"?"tr":"en"}catch(e){return "en"}}

 empty:"Bu aralıkta puanlanmış gün yok."}
};
const t=()=>T[L];
const loc=()=>L==="tr"?"tr-TR":"en-GB";
const n0=v=>v==null||!isFinite(v)?"—":Math.round(v).toLocaleString(loc());
const n1=v=>v==null||!isFinite(v)?"—":v.toLocaleString(loc(),{minimumFractionDigits:1,maximumFractionDigits:1});
const n2=v=>v==null||!isFinite(v)?"—":v.toLocaleString(loc(),{minimumFractionDigits:2,maximumFractionDigits:2});
const fill=(s,o)=>s.replace(/\{(\w+)\}/g,(m,k)=>o[k]!=null?o[k]:m);
const dlab=s=>new Date(s+"T12:00:00").toLocaleDateString(loc(),{day:"numeric",month:"short",year:"numeric",weekday:"short"});
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;

/* ---------- Pro gate: data ships inside the encrypted tier bundles ---------- */
const b64u8=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function loadData(){
  let code=null;try{code=localStorage.getItem("pa-pro")}catch(e){}
  if(!code)throw new Error("nocode");
  const te=new TextEncoder(),sub=crypto.subtle;let wk=null,salt=null;
  for(const tier of["ultra","max","pro"]){
    let B;try{const r=await fetch(tier+".bundle.json",{cache:"no-store"});if(!r.ok)continue;B=await r.json()}catch(e){continue}
    if(!wk||salt!==B.kdf.salt){salt=B.kdf.salt;const base=await sub.importKey("raw",te.encode(code),"PBKDF2",false,["deriveKey"]);
      wk=await sub.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:b64u8(B.kdf.salt),iterations:B.kdf.iter},base,{name:"AES-GCM",length:256},false,["decrypt"])}
    for(const k of B.keys){let raw;try{raw=await sub.decrypt({name:"AES-GCM",iv:b64u8(k.iv)},wk,b64u8(k.ct))}catch(e){continue}
      const ck=await sub.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
      const d=JSON.parse(new TextDecoder().decode(await sub.decrypt({name:"AES-GCM",iv:b64u8(B.iv)},ck,b64u8(B.ct))));
      if(d.dpf&&d.dpf.days)return d.dpf}
  }
  throw new Error("badcode");
}
function locked(why){
  const x=t();
  document.body.innerHTML='<div class="lock"><h2>'+x.lockH+'</h2><p>'+(why==="badcode"?x.lockBad:"")+x.lockP+'</p><a href="index.html#plans" target="_top">'+x.lockA+'</a></div>';
}

/* ---------- charts ---------- */
const C={fc:"#38BDF8",act:"#E6EDF5",d1:"#8A9BB0",d7:"#4A5A70",nl:"#FBBF24",gas:"#F43F5E",left:"#4A5A70",grid:"#26364B",tick:"#8A9BB0"};
function base(ylab){return{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:"index",intersect:false},
  plugins:{legend:{labels:{color:C.tick,boxWidth:12}},tooltip:{callbacks:{label:c=>c.dataset.label+": "+n0(c.parsed.y)+" TL/MWh"}}},
  scales:{x:{ticks:{color:C.tick,maxRotation:0,autoSkip:true},grid:{color:C.grid}},y:{title:{display:true,text:ylab,color:C.tick},ticks:{color:C.tick,callback:v=>n0(v)},grid:{color:C.grid}}}}}

function inRange(){const f=$("from").value,to=$("to").value;return DAYS.filter(r=>r.date>=f&&r.date<=to)}

function kpis(rows){
  const x=t();
  if(!rows.length){$("kpis").innerHTML='<div class="kpi"><div class="l">'+x.empty+'</div></div>';return}
  const m=avg(rows.map(r=>r.mae)),d1=avg(rows.map(r=>r.mae_d1)),d7=avg(rows.map(r=>r.mae_d7)),b=avg(rows.map(r=>r.bias));
  const beat=rows.filter(r=>r.mae<r.mae_d1).length,pct=100*beat/rows.length;
  const k=(l,v,d,cls)=>'<div class="kpi"><div class="l">'+l+'</div><div class="v '+(cls||"")+'">'+v+'</div><div class="d">'+d+'</div></div>';
  $("kpis").innerHTML=
    k(x.k_mae,n0(m)+" TL/MWh",x.d_mae,m<d1?"good":"bad")+
    k(x.k_d1,n0(d1)+" TL/MWh",x.d_naive)+
    k(x.k_d7,n0(d7)+" TL/MWh",x.d_naive)+
    k(x.k_beat,n0(pct)+"%",fill(x.d_beat,{n:n0(rows.length)}),pct>=50?"good":"bad")+
    k(x.k_bias,(b>0?"+":"")+n0(b)+" TL/MWh",x.d_bias);
}

function drawDaily(rows){
  const x=t();if(cD)cD.destroy();
  cD=new Chart($("cDaily"),{type:"line",data:{labels:rows.map(r=>dlab(r.date)),datasets:[
    {label:x.s_model,data:rows.map(r=>r.mae),borderColor:C.fc,backgroundColor:C.fc,pointRadius:2,borderWidth:2},
    {label:x.s_d1,data:rows.map(r=>r.mae_d1),borderColor:C.d1,backgroundColor:C.d1,pointRadius:0,borderWidth:1.5},
    {label:x.s_d7,data:rows.map(r=>r.mae_d7),borderColor:C.d7,backgroundColor:C.d7,pointRadius:0,borderWidth:1.5,borderDash:[4,3]}]},
    options:Object.assign(base("TL/MWh"),{onClick:(e,els)=>{if(els.length){$("day").value=rows[els[0].index].date;drawDay()}}})});
  $("cDaily").setAttribute("aria-label",x.dailynote);
}

function drawDay(){
  const x=t(),r=DAYS.find(z=>z.date===$("day").value);if(!r)return;
  const hrs=[...Array(24).keys()].map(h=>String(h).padStart(2,"0")+":00");
  if(cH)cH.destroy();
  cH=new Chart($("cDay"),{type:"line",data:{labels:hrs,datasets:[
    {label:x.s_act,data:r.actual,borderColor:C.act,backgroundColor:C.act,pointRadius:0,borderWidth:2},
    {label:x.s_fc,data:r.fc,borderColor:C.fc,backgroundColor:C.fc,pointRadius:0,borderWidth:2},
    {label:x.s_d1,data:r.naive_d1,borderColor:C.d1,backgroundColor:C.d1,pointRadius:0,borderWidth:1.2,borderDash:[4,3]}]},options:base("TL/MWh")});
  why(r,hrs);
  const H=x.h;let h='<caption>'+dlab(r.date)+'</caption><thead><tr>'+H.map((c,i)=>'<th>'+c+(i>0&&i<5?" (TL/MWh)":i>=5?" (GW)":"")+'</th>').join("")+'</tr></thead><tbody>';
  const yk=r.yekdem||{},rh=yk.risk_hours||[];
  for(let i=0;i<24;i++){const e=r.fc[i]-r.actual[i];
    h+='<tr'+(rh.includes(i)?' style="box-shadow:inset 3px 0 var(--accent)"':'')+'><td>'+hrs[i]+(rh.includes(i)?' <span class="tag" style="padding:0 6px;font-size:11px">&lt;100</span>':'')+'</td><td>'+n0(r.fc[i])+'</td><td>'+n0(r.actual[i])+'</td><td class="'+(Math.abs(e)>r.mae*1.5?"bad":"")+'">'+(e>0?"+":"")+n0(e)+'</td><td>'+n0(r.naive_d1[i])+'</td><td>'+n2(r.netload_fc[i])+'</td><td>'+(r.netload_act?n2(r.netload_act[i]):"—")+'</td></tr>'}
  h+='<tr class="avg"><td>'+x.avg+'</td><td>'+n0(avg(r.fc))+'</td><td>'+n0(avg(r.actual))+'</td><td>'+(r.bias>0?"+":"")+n0(r.bias)+'</td><td>'+n0(avg(r.naive_d1))+'</td><td>'+n2(avg(r.netload_fc))+'</td><td>'+(r.netload_act?n2(avg(r.netload_act)):"—")+'</td></tr>';
  $("hours").innerHTML=h+'</tbody>';
  const ah=yk.actual_hours||[],el=$("ytag");
  if(rh.length&&ah.length){el.className="tag hit";el.textContent=fill(x.ytag_hit,{n:rh.length,m:ah.length})}
  else if(rh.length){el.className="tag";el.textContent=fill(x.ytag_risk,{n:rh.length})}
  else if(ah.length){el.className="tag hit";el.textContent=fill(x.ytag_miss,{m:ah.length})}
  else{el.className="tag off";el.textContent=x.ytag_off}
}

const pct=v=>v==null?"—":n0(100*v);
function score(){
  const x=t(),S=D.summary||{};if(!S.bands)return;
  $("t-devnote").textContent=fill(x.devnote,{dr:n1(S.dev_ratio),mae:n0(S.mae),mp:n0(S.mean_price),dr1:n1(S.dev_ratio_d1)});
  const MIN=20,dim=n=>n<MIN?' class="dim"':'';
  let h='<thead><tr>'+x.bh.map(c=>'<th>'+c+'</th>').join("")+'</tr></thead><tbody>';
  S.bands.forEach(b=>{const d=dim(b.hours);h+='<tr><td'+d+'>'+n0(b.lo)+' – '+n0(b.hi)+'</td><td'+d+'>'+n0(b.hours)+'</td><td'+d+'>'+n0(b.mae)+'</td><td'+d+'>'+n0(b.mae_d1)+'</td><td'+d+'>'+(b.bias>0?"+":"")+n0(b.bias)+'</td><td'+d+'>'+pct(b.bsr)+'</td><td'+d+'>'+pct(b.wsr)+'</td></tr>'});
  h+='<tr class="avg"><td>'+n0(S.bands[0].lo)+' – '+n0(S.bands[S.bands.length-1].hi)+'</td><td>'+n0(S.days*24)+'</td><td>'+n0(S.mae)+'</td><td>'+n0(S.mae_d1)+'</td><td></td><td>'+pct(S.bsr)+'</td><td>'+pct(S.wsr)+'</td></tr>';
  $("bands").innerHTML=h+'</tbody>';
  const R=S.ramps;let g='<thead><tr>'+x.rh.map(c=>'<th>'+c+'</th>').join("")+'</tr></thead><tbody>';
  [["up",R.up,R.up_from],["down",R.down,R.down_from],["flat",R.flat,null],["fc_up",R.fc_up,R.fc_up_from],["fc_down",R.fc_down,R.fc_down_from]].forEach(([k,c,v])=>{if(!c||!c.hours)return;
    g+='<tr><td>'+fill(x.rl[k],{v:n0(v)})+'</td><td>'+n0(c.hours)+'</td><td>'+n0(c.mae)+'</td><td>'+pct(c.bsr)+'</td><td>'+pct(c.wsr)+'</td><td>'+(c.slope_act>0?"+":"")+n0(c.slope_act)+'</td><td>'+(c.slope_fc>0?"+":"")+n0(c.slope_fc)+'</td><td>'+(k==="flat"?"—":n2(c.slope_ratio))+'</td></tr>'});
  $("ramps").innerHTML=g+'</tbody>';
  const Y=S.yekdem||{};
  $("t-defs").textContent=x.defs+" "+fill(x.ynote,{f:n0(Y.days_flagged),d:n0(S.days),h:n0(Y.days_hit),miss:n0(Y.days_missed)});
}

function csv(){
  const cols=["date","hour","forecast_tl_mwh","actual_tl_mwh","miss_tl_mwh","naive_d1_tl_mwh","naive_d7_tl_mwh","netload_fc_gw","netload_act_gw","gas_fc_gw","gas_act_gw","yekdem_risk","yekdem_actual","model_version"];
  const out=[cols.join(",")];
  DAYS.forEach(r=>{const rh=(r.yekdem||{}).risk_hours||[],ah=(r.yekdem||{}).actual_hours||[];
    for(let h=0;h<24;h++)out.push([r.date,h,r.fc[h],r.actual[h],(r.fc[h]-r.actual[h]).toFixed(1),r.naive_d1[h],r.naive_d7[h],r.netload_fc[h],r.netload_act?r.netload_act[h]:"",r.gas_fc[h],r.gas_act?r.gas_act[h]:"",rh.includes(h)?1:0,ah.includes(h)?1:0,D.version].join(","))});
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+out.join("\r\n")],{type:"text/csv;charset=utf-8"}));a.download="daily-price-forecast-"+DAYS[DAYS.length-1].date+".csv";document.body.appendChild(a);a.click();a.remove();
}

function why(r,hrs){
  const x=t(),w=r.why;if(cW){cW.destroy();cW=null}
  let s='<p>'+fill(x.w_miss,{mae:n0(r.mae),bias:n0(Math.abs(r.bias)),dir:r.bias>0?x.w_high:x.w_low})+'</p>';
  if(!w){$("why").innerHTML=s+'<p class="note">'+x.nowhy+'</p>';$("cWhy").parentElement.hidden=true;return}
  $("cWhy").parentElement.hidden=false;
  const ma=a=>avg(a.map(Math.abs));
  s+='<p>'+fill(x.w_parts,{ld:n0(ma(w.c_load)),wd:n0(ma(w.c_wind)),gas:n0(ma(w.c_gas)),perf:n0(w.mae_perfect_inputs)})+'</p>';
  s+='<p><b>'+x.w_hit+'</b></p><ul>';
  const fs=w.flat_shift||{};
  const LIM=3;
  [["netload",x.w_shift_nl,x.what_nl],["gas",x.w_shift_gas,x.what_gas]].forEach(([k,tx,what])=>{const f=fs[k];if(!f)return;
    if(Math.abs(f.delta_gw)<=LIM&&f.mae_after<r.mae*0.9)s+='<li>'+fill(tx,{gw:n2(Math.abs(f.delta_gw)),dir:f.delta_gw>0?x.up:x.down,after:n0(f.mae_after)})+'</li>';
    else s+='<li>'+fill(x.w_noshift,{what:what,lim:n0(LIM)})+'</li>';});
  s+='<li>'+x.w_overfit+'</li></ul>';
  $("why").innerHTML=s;
  cW=new Chart($("cWhy"),{type:"bar",data:{labels:hrs,datasets:[
    {label:x.c_load,data:w.c_load,backgroundColor:C.nl,stack:"s"},
    {label:x.c_wind,data:w.c_wind,backgroundColor:C.fc,stack:"s"},
    {label:x.c_gas,data:w.c_gas,backgroundColor:C.gas,stack:"s"},
    {label:x.c_left,data:w.unexplained,backgroundColor:C.left,stack:"s"}]},
    options:Object.assign(base("TL/MWh"),{scales:Object.assign(base("TL/MWh").scales,{x:{stacked:true,ticks:{color:C.tick,maxRotation:0,autoSkip:true},grid:{color:C.grid}},y:{stacked:true,title:{display:true,text:"TL/MWh",color:C.tick},ticks:{color:C.tick,callback:v=>n0(v)},grid:{color:C.grid}}})})});
}

function method(){
  const x=t(),c=D.latest_coef||{};
  const parts=Object.keys(x.coef).filter(k=>c[k]!=null).map(k=>fill(x.coef[k],{v:k==="p_d1"||k==="p_d7"?n2(c[k]):n0(c[k])}));
  $("method").innerHTML=x.m.map(p=>'<p>'+fill(p,{n:n0(D.method.train_days),coef:parts.join(" · ")})+'</p>').join("");
}

function texts(){
  const x=t();document.documentElement.lang=L;document.title=x.title;
  ["title","sub","range","from","to","day","pick","why","hours","method","disc","score","bands","ramps","bandnote","rampnote","dlnote"].forEach(k=>{const e=$("t-"+k);if(e)e.textContent=x[k]});
  $("all").textContent=x.all;$("dl").textContent=x.dl;$("t-dailynote").textContent=x.dailynote;$("t-daynote").textContent=x.daynote;$("t-whynote").textContent=x.whynote;
  const cur=$("day").value;
  $("day").innerHTML=DAYS.slice().reverse().map(r=>'<option value="'+r.date+'">'+dlab(r.date)+' · '+n0(r.mae)+' TL/MWh</option>').join("");
  if(cur)$("day").value=cur;
}

function render(){const rows=inRange();kpis(rows);drawDaily(rows);score();drawDay();method()}

function init(dpf){
  D=dpf;DAYS=(dpf.days||[]).filter(r=>r.actual&&r.mae!=null);
  if(!DAYS.length){$("app").hidden=false;texts();$("kpis").innerHTML='<div class="kpi"><div class="l">'+t().empty+'</div></div>';return}
  const f=DAYS[0].date,l=DAYS[DAYS.length-1].date;
  ["from","to"].forEach(id=>{$(id).min=f;$(id).max=l});
  $("from").value=f;$("to").value=l;
  $("app").hidden=false;texts();$("day").value=l;render();
  $("from").onchange=$("to").onchange=render;
  $("all").onclick=()=>{$("from").value=f;$("to").value=l;render()};
  $("day").onchange=drawDay;$("dl").onclick=csv;
}

window.addEventListener("storage",e=>{if(e.key==="pa-lang"&&D){L=siteLang();texts();render()}});
loadData().then(init).catch(e=>locked(e.message));
})();
</script>
